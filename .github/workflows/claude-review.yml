# Shortcut for a Claude review: the repo owner adds the "claude-review" label
# to a PR. Same review as writing "@claude review this PR", read-only: Claude
# comments inline with "Commit suggestion" blocks and pushes nothing.
# PRs from forks are skipped (allow_fork_prs is off).
name: Claude PR Review

on:
  pull_request:
    types: [labeled]

concurrency:
  group: claude-${{ github.event.pull_request.number }}
  cancel-in-progress: false

jobs:
  review:
    if: github.event.label.name == 'claude-review' && github.actor == github.repository_owner
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write
      id-token: write
      actions: read # lets Claude read CI results on the PR
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6
        with:
          fetch-depth: 1

      - name: Review PR
        uses: anthropics/claude-code-action@v1
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          track_progress: true
          additional_permissions: |
            actions: read
          prompt: |
            REPO: ${{ github.repository }}
            PR NUMBER: ${{ github.event.pull_request.number }}

            Review this pull request. Write in English. Read AGENTS.md first:
            its section 2 domain rules are non-negotiable. Check that the PR:
            - never mixes teams in exported or previewed audio, except
              all-talk periods detected from FACEIT chat notices;
            - never normalizes exports (Plan.Normalize is preview-only);
            - keeps report text in English;
            - bumps demo.CacheVersion if parser output or the cache layout changed;
            - adds no uploads, analytics, tracking or third-party calls;
            - updates frontend/lang/en.json and pt-BR.json together;
            - keeps the frontend module layers unidirectional.
            Also look for correctness bugs, missing tests, security issues
            and style.

            Use inline comments on the exact lines and put concrete fixes in
            GitHub suggestion blocks so they can be accepted with "Commit
            suggestion". End with one top-level summary comment.
          claude_args: |
            --model claude-opus-5-5
            --allowedTools "mcp__github_inline_comment__create_inline_comment,Bash(gh pr comment:*),Bash(gh pr diff:*),Bash(gh pr view:*)"
