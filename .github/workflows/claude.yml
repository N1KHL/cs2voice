# Calls Claude when the repo owner writes "@claude" in an issue, a PR comment
# or a PR review. On a PR it reviews (inline comments with "Commit suggestion"
# blocks) or pushes fixes to the PR branch; on an issue it pushes to a new
# claude/ branch and replies with a link to open the PR. It never opens or
# merges a PR itself. PRs from forks are skipped (allow_fork_prs is off).
name: Claude Code

on:
  issue_comment:
    types: [created]
  pull_request_review_comment:
    types: [created]
  issues:
    types: [opened, assigned]
  pull_request_review:
    types: [submitted]

# One run at a time per issue/PR so two runs never push to the same branch.
# GitHub keeps at most one waiting run: a third quick request replaces the
# second while the first is still running.
concurrency:
  group: claude-${{ github.event.issue.number || github.event.pull_request.number }}
  cancel-in-progress: false

jobs:
  claude:
    # Only the repo owner can call Claude, even if collaborators are added.
    if: |
      github.actor == github.repository_owner && (
        (github.event_name == 'issue_comment' && contains(github.event.comment.body, '@claude')) ||
        (github.event_name == 'pull_request_review_comment' && contains(github.event.comment.body, '@claude')) ||
        (github.event_name == 'pull_request_review' && contains(github.event.review.body, '@claude')) ||
        (github.event_name == 'issues' && (contains(github.event.issue.body, '@claude') || contains(github.event.issue.title, '@claude')))
      )
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
      issues: write
      id-token: write
      actions: read # lets Claude read CI results on PRs
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6
        with:
          fetch-depth: 1

      # Same toolchain as scripts/test.sh, so Claude can run the full suite.
      - name: Set up Go
        uses: actions/setup-go@v6
        with:
          go-version-file: go.mod

      - name: Set up Node
        uses: actions/setup-node@v6
        with:
          node-version: lts/*

      - name: Run Claude Code
        uses: anthropics/claude-code-action@v1
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          track_progress: true
          use_commit_signing: true
          additional_permissions: |
            actions: read
          claude_args: |
            --model claude-opus-5-5
            --allowedTools "mcp__github_inline_comment__create_inline_comment,Bash(bash scripts/test.sh),Bash(gofmt:*),Bash(go test:*),Bash(go vet:*),Bash(go build:*),Bash(node --check:*),Bash(node --test:*)"
            --append-system-prompt "Always write on GitHub in English, whatever language the request is in. Follow AGENTS.md and CONTRIBUTING.md and never relax the domain rules in AGENTS.md section 2. When reviewing, use inline comments on the exact lines and put concrete fixes in GitHub suggestion blocks so the owner can click Commit suggestion; comment on style too, not only bugs. Check every change against the AGENTS.md rules: teams never mixed outside FACEIT all-talk periods, exports never normalized, report text in English, demo.CacheVersion bumped when parser output or the cache layout changes, no uploads, analytics or third-party calls, frontend/lang/en.json and pt-BR.json updated together, frontend module layers kept one-way. When changing code, run 'bash scripts/test.sh' and make it pass before pushing. Never edit files under .github/workflows/."
